<!DOCTYPE html>
<html>
    <head>
        <title>mudorganisms</title>
        <style>
html {
    height: 100%;
}
body {
    display: grid;
    place-items: center;
    height: 100%;
}
#container {
    width: 100%;
    height: 100%;
}
        </style>
        <script src="./chart/plotly-3.6.0.min.js" charset="utf-8"></script>
    </head>
    <body>
        <div id="container"></div>
        <script type="module">

async function main() {
    const log = await fetch('/log').then((res) => res.text());
    const traces = {};
    for (const line of log.split('\n')) {
        const parts = line.split('\t');
        if (parts.length < 2) continue;
        if (parts[1].startsWith('note:')) continue;
        if (parts[1].indexOf(':') === -1) continue;
        const time = parts[0];
        for (const part of parts.slice(1)) {
            const i = part.lastIndexOf(':');
            const key = part.substring(0, i);
            const val = Number(part.substring(i + 1));
            if (!traces[key]) {
                traces[key] = {
                    x: [],
                    y: [],
                    name: key,
                };
            }
            traces[key].x.push(time);
            traces[key].y.push(val);
        }
    }
    Plotly.newPlot(container, Object.values(traces), {}, {}, { responsive: true })
}

main();

        </script>
    </body>
</html>
